<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - FREE FIRE TOP UP BD</title>
  <style>
    :root {
      --bg: #090b10;
      --panel: #141923;
      --border: #263043;
      --text: #f7f8fa;
      --muted: #9aa4b8;
      --accent: #f59e0b;
      --ok: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }
    .wrap { max-width: 920px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 16px; color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    h2 { font-size: 16px; margin-bottom: 10px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #0d1118;
      color: var(--text);
      font-size: 14px;
    }
    button {
      margin-top: 10px;
      padding: 9px 14px;
      border: none;
      border-radius: 7px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
      color: #090b10;
    }
    .btn-sm { padding: 5px 10px; margin-top: 0; font-size: 12px; }
    .btn-ok { background: var(--ok); color: #06210f; }
    .btn-del { background: var(--danger); color: #fff; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .row:last-child { border-bottom: none; }
    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: #e2e8f0;
    }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>FREE FIRE TOP UP BD — Admin Panel</h1>

    <div class="grid">
      <div class="box">
        <h2>নতুন প্যাকেজ যুক্ত করুন</h2>
        <label for="pkgName">প্যাকেজের নাম</label>
        <input id="pkgName" type="text" placeholder="যেমন: 115 Diamonds" />
        <label for="pkgPrice">মূল্য (টাকা)</label>
        <input id="pkgPrice" type="number" placeholder="যেমন: 85" />
        <button id="addPkgBtn" type="button">প্যাকেজ যোগ করুন</button>
      </div>

      <div class="box">
        <h2>পেমেন্ট ও সিকিউরিটি সেটিংস</h2>
        <label for="bkashNum">bKash / Nagad নম্বর</label>
        <input id="bkashNum" type="text" placeholder="01XXXXXXXXX" />
        <label for="adminPass">অ্যাডমিন পিন / পাসওয়ার্ড</label>
        <input id="adminPass" type="password" placeholder="নতুন পাসওয়ার্ড" />
        <button id="saveCfgBtn" type="button">সেটিংস সেভ করুন</button>
      </div>
    </div>

    <div class="box" style="margin-bottom: 20px;">
      <h2>প্যাকেজ তালিকা</h2>
      <div id="pkgList"></div>
    </div>

    <div class="box">
      <h2>অর্ডার তালিকা</h2>
      <div id="orderList"></div>
    </div>
  </div>

  <script>
    const PKG_KEY = 'ff_pkgs';
    const ORD_KEY = 'ff_ords';
    const CFG_KEY = 'ff_cfg';

    let pkgs = JSON.parse(localStorage.getItem(PKG_KEY) || '[]');
    let ords = JSON.parse(localStorage.getItem(ORD_KEY) || '[]');
    let cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{"bkash":"","pass":""}');

    if (!pkgs.length) {
      pkgs = [
        { name: '25 Diamonds', price: 25 },
        { name: '115 Diamonds', price: 85 },
        { name: 'Weekly Membership', price: 155 }
      ];
    }

    function saveAll() {
      localStorage.setItem(PKG_KEY, JSON.stringify(pkgs));
      localStorage.setItem(ORD_KEY, JSON.stringify(ords));
      localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    }

    function renderPkgs() {
      const box = document.getElementById('pkgList');
      if (!pkgs.length) {
        box.innerHTML = '<div class="row">কোনো প্যাকেজ নেই।</div>';
        return;
      }
      box.innerHTML = '';
      pkgs.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'row';

        const info = document.createElement('div');
        info.textContent = `${item.name} — ৳${item.price}`;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'btn-sm';
        editBtn.type = 'button';
        editBtn.textContent = 'দাম বদলান';
        editBtn.onclick = () => {
          const next = prompt(`${item.name} এর নতুন দাম লিখুন:`, item.price);
          const num = Number(next);
          if (next !== null && !Number.isNaN(num) && num > 0) {
            pkgs[idx].price = num;
            saveAll();
            renderPkgs();
          }
        };

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-sm btn-del';
        delBtn.type = 'button';
        delBtn.textContent = 'মুছুন';
        delBtn.onclick = () => {
          pkgs.splice(idx, 1);
          saveAll();
          renderPkgs();
        };

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        row.appendChild(info);
        row.appendChild(actions);
        box.appendChild(row);
      });
    }

    function renderOrders() {
      const box = document.getElementById('orderList');
      if (!ords.length) {
        box.innerHTML = '<div class="row">এখনও কোনো অর্ডার আসেনি।</div>';
        return;
      }
      box.innerHTML = '';
      ords.forEach((ord, idx) => {
        const row = document.createElement('div');
        row.className = 'row';

        const info = document.createElement('div');
        info.textContent = `UID: ${ord.uid || '-'} | ${ord.pkg || '-'} | TrxID: ${ord.trx || '-'}`;

        const right = document.createElement('div');
        right.className = 'actions';

        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = ord.status || 'Pending';

        const doneBtn = document.createElement('button');
        doneBtn.className = 'btn-sm btn-ok';
        doneBtn.type = 'button';
        doneBtn.textContent = 'Completed';
        doneBtn.onclick = () => {
          ords[idx].status = 'Completed';
          saveAll();
          renderOrders();
        };

        right.appendChild(badge);
        right.appendChild(doneBtn);
        row.appendChild(info);
        row.appendChild(right);
        box.appendChild(row);
      });
    }

    document.getElementById('addPkgBtn').onclick = () => {
      const nameEl = document.getElementById('pkgName');
      const priceEl = document.getElementById('pkgPrice');
      const name = nameEl.value.trim();
      const price = Number(priceEl.value);
      if (!name || Number.isNaN(price) || price <= 0) {
        alert('সঠিক প্যাকেজের নাম ও মূল্য দিন।');
        return;
      }
      pkgs.push({ name, price });
      saveAll();
      renderPkgs();
      nameEl.value = '';
      priceEl.value = '';
    };

    document.getElementById('saveCfgBtn').onclick = () => {
      const bkashEl = document.getElementById('bkashNum');
      const passEl = document.getElementById('adminPass');
      if (bkashEl.value.trim()) cfg.bkash = bkashEl.value.trim();
      if (passEl.value.trim()) cfg.pass = passEl.value.trim();
      saveAll();
      passEl.value = '';
      alert('সেটিংস সেভ হয়েছে।');
    };

    document.getElementById('bkashNum').value = cfg.bkash || '';
    saveAll();
    renderPkgs();
    renderOrders();
  </script>
</body>
</html>
